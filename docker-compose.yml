# runs DB and later keycloak when available 
# Start: docker compose up -d
# Stop: docker compose down         (keeps the data)
# Reset: docker compose down -v     (THIS DELETES THE DATA)


services:

  db:
    image: postgis/postgis:16-3.4
    # platform: linux/amd64             #apple silicon macs
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - projectdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 5

# keycloak here later on...



volumes:
  projectdata:
